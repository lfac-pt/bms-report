<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pré-visualização da integração do relatório</title>
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
        background: #f4f6f3;
      }
      main {
        max-width: 1200px;
        margin: auto;
        padding: 24px 12px;
      }
      iframe {
        display: block;
        width: 100%;
        border: 0;
        background: white;
      }
      h1 {
        font-size: 24px;
      }
      p {
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Pré-visualização da integração do relatório</h1>
      <p>
        O relatório abaixo é independente desta página. A altura ajusta-se ao abrir listas, carregar
        fotografias e alterar a largura da janela.
      </p>
      <div
        role="group"
        aria-label="Largura da pré-visualização"
        style="margin-bottom: 16px; display: flex; gap: 8px"
      >
        <button type="button" data-width="1200" aria-pressed="true">Computador</button>
        <button type="button" data-width="375" aria-pressed="false">Telemóvel</button>
      </div>
      <iframe
        data-bms-report
        src="report-2026.html"
        title="Resultados de 2026 — relatório integrado"
        width="100%"
        height="1600"
      ></iframe>
      <p>Fim do relatório integrado.</p>
    </main>
    <script>
      document.querySelectorAll("button[data-width]").forEach(function (button) {
        button.addEventListener("click", function () {
          document.querySelector("main").style.maxWidth = button.dataset.width + "px";
          document.querySelectorAll("button[data-width]").forEach(function (other) {
            other.setAttribute("aria-pressed", String(other === button));
          });
        });
      });
      // On localhost use a different hostname to exercise the cross-origin handshake.
      if (window.location.hostname === "localhost") {
        var url = new URL("report-2026.html", window.location.href);
        url.hostname = "127.0.0.1";
        document.querySelector("iframe").src = url.href;
      }
    </script>
    <script src="embed-report.js" defer></script>
  </body>
</html>
